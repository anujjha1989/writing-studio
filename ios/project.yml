name: WritingStudio
options:
  bundleIdPrefix: com.anujjha
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
targets:
  WritingStudio:
    type: application
    platform: iOS
    sources: [WritingStudio]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.anujjha.writingstudio
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Writing Studio
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Connect to your Writing Studio server on your home network.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
  WritingStudioTests:
    type: bundle.unit-test
    platform: iOS
    sources: [WritingStudioTests]
    dependencies:
      - target: WritingStudio
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  WritingStudio:
    build:
      targets:
        WritingStudio: all
    test:
      targets: [WritingStudioTests]
